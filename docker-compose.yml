services:
  datadog-agent:
    image: datadog/agent:7
    environment:
      - DD_API_KEY=${DD_API_KEY}
      - DD_SITE=${DD_SITE:-datadoghq.com}
      - DD_APM_ENABLED=true
      - DD_DOGSTATSD_NON_LOCAL_TRAFFIC=true
      - DD_HOSTNAME=java-csv-datadog-demo
    ports:
      - "8126:8126"
      - "8125:8125/udp"

  app:
    build: .
    depends_on:
      - datadog-agent
    environment:
      - DD_AGENT_HOST=datadog-agent
