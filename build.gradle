plugins {
    id 'java'
    id 'application'
}

group = 'com.example'
version = '1.0.0'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(25)
    }
}

application {
    mainClass = 'com.example.csvdatadog.App'
    applicationDefaultJvmArgs = [
        "-javaagent:${rootDir}/build/libs/dd-java-agent.jar",
        '-Ddd.trace.sample.rate=1',
        '-Ddd.logs.injection=true'
    ]
}

repositories {
    mavenCentral()
}

configurations {
    ddAgent
}

dependencies {
    implementation 'org.apache.commons:commons-csv:1.11.0'
    implementation 'org.slf4j:slf4j-api:2.0.13'
    implementation 'ch.qos.logback:logback-classic:1.5.6'
    implementation 'net.logstash.logback:logstash-logback-encoder:8.0'
    implementation 'com.datadoghq:dd-trace-api:1.50.0'
    ddAgent 'com.datadoghq:dd-java-agent:1.50.0'
}

jar {
    archiveBaseName = 'java-csv-datadog-demo'
    archiveVersion = '1.0.0'
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
    manifest {
        attributes 'Main-Class': 'com.example.csvdatadog.App'
    }
    from {
        configurations.runtimeClasspath.collect { it.isDirectory() ? it : zipTree(it) }
    }
}

tasks.register('copyDdAgent', Copy) {
    from configurations.ddAgent
    into layout.buildDirectory.dir('libs')
    rename { 'dd-java-agent.jar' }
}

assemble.dependsOn copyDdAgent
